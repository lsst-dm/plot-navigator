[build-system]
requires = ["setuptools>=74", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "plot-navigator"
dynamic = ["version"]
description = "LSST plot navigator backend API"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pillow>=10",
    "pydantic>=2",
    "pydantic-settings>=2",
    "lsst-daf-butler",
    "lsst-resources",
    "boto3",
    "redis"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",        # required by FastAPI's TestClient
    "ruff>=0.6",
]

[project.scripts]
serve = "lsst.plot_navigator.main:serve"
make-test-butler = "lsst.plot_navigator.make_test_butler:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lsst*"]
namespaces = true

[tool.setuptools_scm]
fallback_version = "0.1.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.42.91",
    "pytest>=9.0.2",
]
